name: lint-and-self-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  python-unit:
    name: python lint + self-tests (ubuntu / py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      # actions/checkout@v7.0.0
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      # actions/setup-python@v6.3.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned lint dependency
        run: python -m pip install --disable-pip-version-check "ruff==0.15.21"

      - name: Run Ruff
        run: ruff check scripts/

      - name: Run Python self-tests
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            evidence_ledger.py
            data_clean.py
            citation_export.py
            citation_render.py
            extract_tables.py
            score_source.py
            research_plan.py
            run_dogfood.py
            pdf_extract.py
            wayback.py
            wikidata.py
            social_snapshot.py
            citation_resolver.py
            report_render.py
            ocr.py
            translate.py
            embed_corpus.py
            citation_graph.py
            multi_extract.py
            dedup_near.py
            http_cache.py
            bench_harness_check.py
            run_metadata.py
            harvest_terms.py
            release_verify.py
            quality_eval.py
            resource_limits.py
          )
          python scripts/_ssrf_helpers.py
          python scripts/content_sanitize.py
          for script in "${scripts[@]}"; do
            python "scripts/${script}" self-test
          done
          python scripts/check_internal_refs.py
          python scripts/check_internal_refs.py --decision-tree
          python scripts/check_contract.py

  node-unit:
    name: node syntax + self-tests (ubuntu / node${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      # actions/checkout@v7.0.0
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      # actions/setup-node@v6.4.0
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Syntax-check every Node module
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          modules=(scripts/*.mjs scripts/lib/*.mjs)
          test ${#modules[@]} -gt 0
          for file in "${modules[@]}"; do
            node --check "$file"
          done

      - name: Run Node self-tests
        run: npm run self-test:node

      - name: Verify npm pack excludes generated Python caches
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="examples/evals/quality/__pycache__"
          fixture="$cache_dir/package_boundary_ci_probe.pyc"
          trap 'rm -rf "$cache_dir"' EXIT
          mkdir -p "$cache_dir"
          printf '%s\n' 'generated bytecode probe' > "$fixture"
          npm run package:check

      - name: Verify npm pack rejects an untracked publishable file
        shell: bash
        run: |
          set -euo pipefail
          fixture="examples/package-boundary-ci-probe.md"
          output="$(mktemp)"
          trap 'rm -f "$fixture" "$output"' EXIT
          test ! -e "$fixture"
          printf '%s\n' 'temporary package-boundary probe' > "$fixture"
          if npm pack --dry-run --json > "$output" 2>&1; then
            cat "$output" >&2
            echo "npm pack accepted an untracked publishable file" >&2
            exit 1
          fi
          grep -F "package contains files that are not tracked by Git" "$output"

  integration-ubuntu:
    name: full integration + one Chromium smoke (ubuntu / py3.12 / node20)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7.0.0
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      # actions/setup-node@v6.4.0
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "20"
          cache: npm

      # actions/setup-python@v6.3.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install system extraction dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils tesseract-ocr tesseract-ocr-vie

      - name: Install locked Node dependencies and Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install chromium --with-deps

      - name: Run complete offline helper suite
        env:
          D_RESEARCH_LEDGER_KEY: ""
        run: npm run self-test

      - name: Run adversarial acceptance without duplicate browser launch
        env:
          D_RESEARCH_SKIP_BROWSER_SMOKE: "1"
        run: npm run acceptance

      - name: Run one real Chromium smoke against local fixtures
        run: npm run browser:smoke

  integration-windows:
    name: full integration + one Chromium smoke (windows / py3.11 / node20)
    runs-on: windows-latest
    steps:
      # actions/checkout@v7.0.0
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      # actions/setup-node@v6.4.0
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "20"
          cache: npm

      # actions/setup-python@v6.3.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Install locked Node dependencies and Chromium
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install chromium

      - name: Install system extraction dependencies
        shell: pwsh
        run: choco install pandoc poppler tesseract --yes --no-progress

      - name: Run complete offline helper suite
        env:
          D_RESEARCH_LEDGER_KEY: ""
        run: npm run self-test

      - name: Run adversarial acceptance without duplicate browser launch
        env:
          D_RESEARCH_SKIP_BROWSER_SMOKE: "1"
        run: npm run acceptance

      - name: Run one real Chromium smoke against local fixtures
        run: npm run browser:smoke

  bench-harness-consistency:
    name: bench-harness consistency (not an agent benchmark)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7.0.0
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      # actions/setup-python@v6.3.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Run bench-harness consistency check
        run: python scripts/bench_harness_check.py check-all --strict
