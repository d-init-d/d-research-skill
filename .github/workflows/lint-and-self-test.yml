name: lint-and-self-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  python-unit:
    name: python lint + self-tests (ubuntu / py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      # actions/checkout@v4
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # actions/setup-python@v5
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned lint dependency
        run: python -m pip install --disable-pip-version-check "ruff==0.15.13"

      - name: Run Ruff
        run: ruff check scripts/

      - name: Run Python self-tests
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            evidence_ledger.py
            data_clean.py
            citation_export.py
            citation_render.py
            extract_tables.py
            score_source.py
            research_plan.py
            run_dogfood.py
            pdf_extract.py
            wayback.py
            wikidata.py
            social_snapshot.py
            citation_resolver.py
            report_render.py
            ocr.py
            translate.py
            embed_corpus.py
            citation_graph.py
            multi_extract.py
            dedup_near.py
            http_cache.py
            bench_harness_check.py
            run_metadata.py
            harvest_terms.py
            resource_limits.py
          )
          python scripts/_ssrf_helpers.py
          for script in "${scripts[@]}"; do
            python "scripts/${script}" self-test
          done
          python scripts/check_internal_refs.py
          python scripts/check_internal_refs.py --decision-tree
          python scripts/check_contract.py

  node-unit:
    name: node syntax + self-tests (ubuntu / node${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      # actions/checkout@v4
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # actions/setup-node@v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Syntax-check every Node module
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          modules=(scripts/*.mjs scripts/lib/*.mjs)
          test ${#modules[@]} -gt 0
          for file in "${modules[@]}"; do
            node --check "$file"
          done

      - name: Run Node self-tests
        run: npm run self-test:node

  integration-ubuntu:
    name: full integration + one Chromium smoke (ubuntu / py3.12 / node20)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # actions/setup-node@v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm

      # actions/setup-python@v5
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install system extraction dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils tesseract-ocr tesseract-ocr-vie

      - name: Install locked Node dependencies and Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install chromium --with-deps

      - name: Run complete offline helper suite
        env:
          D_RESEARCH_LEDGER_KEY: ""
        run: npm run self-test

      - name: Run adversarial acceptance without duplicate browser launch
        env:
          D_RESEARCH_SKIP_BROWSER_SMOKE: "1"
        run: npm run acceptance

      - name: Run one real Chromium smoke against local fixtures
        run: npm run browser:smoke

  integration-windows:
    name: full integration + one Chromium smoke (windows / py3.11 / node20)
    runs-on: windows-latest
    steps:
      # actions/checkout@v4
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # actions/setup-node@v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm

      # actions/setup-python@v5
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install locked Node dependencies and Chromium
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install chromium

      - name: Install system extraction dependencies
        shell: pwsh
        run: choco install pandoc poppler tesseract --yes --no-progress

      - name: Run complete offline helper suite
        env:
          D_RESEARCH_LEDGER_KEY: ""
        run: npm run self-test

      - name: Run adversarial acceptance without duplicate browser launch
        env:
          D_RESEARCH_SKIP_BROWSER_SMOKE: "1"
        run: npm run acceptance

      - name: Run one real Chromium smoke against local fixtures
        run: npm run browser:smoke

  bench-harness-consistency:
    name: bench-harness consistency (not an agent benchmark)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # actions/setup-python@v5
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Run bench-harness consistency check
        run: python scripts/bench_harness_check.py check-all --strict
